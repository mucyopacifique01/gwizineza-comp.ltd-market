name: Build and type-check

on:
  push:
    branches: [main, migration/django-supabase-otp]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django backend
        run: pip install -r backend/requirements.txt
      - name: Check Django configuration
        run: python backend/manage.py check
      - name: Create local test schema
        run: python backend/manage.py migrate --run-syncdb --noinput
      - name: Test Django API and OTP hook
        run: python backend/manage.py test store

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --include=optional
      - run: npm run check:figma-routes
      - run: npm run check:architecture
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
