services:
  - type: web
    name: gwizineza-market
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --include=optional && npm run build
    # Keep Prisma schema synchronized with MongoDB before starting Next.js.
    startCommand: npx prisma db push --skip-generate && npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: product-images
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
      - key: SUPABASE_SEND_SMS_HOOK_SECRET
        sync: false
      - key: APP_URL
        value: https://gwizineza-company-ltd.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
